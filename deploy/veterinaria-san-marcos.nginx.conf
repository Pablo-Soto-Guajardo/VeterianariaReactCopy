# Configuración de Nginx para servir la tienda como SPA (Guía 12).
# Destino en la instancia EC2: /etc/nginx/sites-available/veterinaria-san-marcos
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/veterinaria-san-marcos;
    index index.html;

    location / {
        # Si la URL no es un archivo real, entrega index.html
        # para que React Router interprete la ruta (/productos/ME005, /admin, ...).
        try_files $uri $uri/ /index.html;
    }
}
